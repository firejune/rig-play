# Release: the cut is one click, and no secret leaves this repository.
#
# Every push to main hands the commits to release-please, which keeps a
# "release: vX.Y.Z" pull request open — next version derived from the
# conventional-commit subjects, CHANGELOG.md generated, package.json bumped.
# Merging that PR is the release: the resulting push runs this workflow again,
# release-please tags vX.Y.Z and cuts the GitHub release, and the same run
# publishes to npm over OIDC (trusted publishing) — no npm token, no OTP. It
# publishes the package three times (#65, #98): `@rig-c/play`, the name in
# package.json, then `rig-play` (1.0–1.8) and `spine-html` (0.x), the names it
# shipped under before, kept as aliases carrying the same files at every version.
#
# Two constraints are load-bearing, do not "simplify" them away:
#   - Every publish must stay in THIS file. npm's trusted publisher for each
#     name — @rig-c/play, rig-play and spine-html, one form per package on
#     npmjs.com, each naming the repository rig-c/play — is pinned to the
#     workflow filename `release.yml`.
#   - It must stay on a GitHub-hosted runner. npm does not support OIDC from
#     self-hosted runners.
name: release

on:
  push:
    branches: [main]
  # The aliases on their own (#65): when the cut published `@rig-c/play` and an
  # alias publish failed after it — the first rig-play cut did, on a
  # trusted-publisher form that still named the repository's old path — the
  # release job cannot be re-run, because its first publish would now be
  # refused as an existing version before the alias step is reached. This path
  # publishes only the aliases named, from the tarball the registry serves for
  # `@rig-c/play` at that version (never from a rebuild), and takes the same
  # confirmation.
  workflow_dispatch:
    inputs:
      alias_version:
        description: 'Version already published as @rig-c/play (e.g. 1.9.0) to publish under the aliases'
        required: true
        type: string
      alias_names:
        description: 'Which aliases to publish, space-separated (an alias already at that version would be refused)'
        required: true
        default: 'rig-play spine-html'
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # 20 minutes covered the publish; the confirmation below may wait up to 15
    # more for the registry to serve each name, so the ceiling sits above both.
    timeout-minutes: 40
    permissions:
      contents: write # release commit, tag, GitHub release
      pull-requests: write # open and update the release PR
      issues: write # release-please labels
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # GITHUB_TOKEN is the intended default here. Its one limitation is
          # that a PR it opens does not start other workflows, so the release
          # PR carries no CI checks of its own — see RELEASING.md for why that
          # is acceptable and how to opt into RELEASE_PLEASE_TOKEN if it ever
          # is not. The fallback below needs no edit to this file.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below runs only on the push that merged the release PR.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created == 'true' }}
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.release.outputs.release_created == 'true' }}

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created == 'true' }}
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10; OIDC exchange landed in npm 11.5.1.
      - name: Use an npm that speaks OIDC
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          npm install -g npm@latest
          npm --version

      # The repository's lockfile is bun.lock — there is no package-lock.json,
      # so `npm ci` has nothing to read. Deps exist only to let prepublishOnly
      # run tsc; the publish itself is npm's.
      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: bun install --frozen-lockfile

      # prepublishOnly runs `build:lib` (tsc -p tsconfig.build.json), so the
      # tarball is built from the tagged tree and a type error fails the
      # publish instead of shipping. `--access public`: a scoped package is
      # restricted unless told otherwise.
      - name: Publish @rig-c/play
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm publish --provenance --access public

      # The aliases (#65, #98): the same files under the names the package
      # shipped as before, so every link that points at `rig-play` or
      # `spine-html` keeps receiving every version. For each,
      # `scripts/alias-tarball.mjs` packs this checkout — the
      # tagged tree the step above built `dist/` in and published from, with
      # scripts ignored so nothing is rebuilt — into the runner's temp
      # directory, rewrites the one `"name"` line of the extracted
      # package.json, packs that again, and prints the path only after holding
      # the result to the package tarball file by file. The checkout is never
      # modified.
      #
      # No lifecycle script runs here, and that is the design rather than a
      # gap: `npm publish <tarball>` runs none (`--ignore-scripts` says so
      # explicitly), so `prepublishOnly` gates the step above and only that
      # one. The alias is that publish's files, and the script holds it to them.
      - name: Publish the aliases rig-play and spine-html
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          set -euo pipefail
          for alias in rig-play spine-html; do
            alias_tgz="$(node scripts/alias-tarball.mjs pack --alias "$alias" --out "$RUNNER_TEMP/alias-$alias")"
            npm publish "$alias_tgz" --provenance --access public --ignore-scripts
          done

      # The confirmation: every name, at the version just released, fetched
      # from the registry and compared unpacked — the same paths, every byte
      # the same but the manifest's name line — and the comparison line
      # printed. It reads what the registry serves, not what this tree packs.
      # The registry can take minutes to serve what was just published (~45 s
      # after the workflow on v0.6.0), so each fetch is retried for up to 15
      # minutes; a version still not served at the end is a red that says the
      # confirmation was not taken, not that the package is wrong. A red here
      # does not un-publish anything; it says the cut needs a follow-up.
      - name: Confirm every name serves the same files
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          dest="$RUNNER_TEMP/confirm"
          fetch() {
            local name="$1" into="$2" attempt
            mkdir -p "$into"
            for attempt in $(seq 1 30); do
              if npm pack "$name@$version" --pack-destination "$into" --loglevel=error > /dev/null 2>&1; then
                echo "fetched $name@$version on attempt $attempt"
                return 0
              fi
              sleep 30
            done
            echo "::error::$name@$version was not served within 15 minutes: confirmation NOT taken"
            return 1
          }
          fetch @rig-c/play "$dest/canonical"
          npm view "@rig-c/play@$version" version
          for alias in ${ALIASES:-rig-play spine-html}; do
            fetch "$alias" "$dest/$alias"
            npm view "$alias@$version" version
            node scripts/alias-tarball.mjs compare "$dest"/canonical/*.tgz "$dest/$alias"/*.tgz
          done

  # Dispatch only: see `workflow_dispatch` above.
  alias:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    env:
      ALIAS_VERSION: ${{ inputs.alias_version }}
      ALIASES: ${{ inputs.alias_names }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.alias_version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@latest
          npm --version

      # The source is the registry's own `@rig-c/play@<version>` tarball (npm
      # names it `rig-c-play-<version>.tgz`), so each alias is that publish's
      # files whatever the checkout holds; the script rewrites the one name
      # line and holds the result to it file by file.
      - name: Publish the named aliases from the registry's @rig-c/play tarball
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src"
          mkdir -p "$src"
          npm pack "@rig-c/play@$ALIAS_VERSION" --pack-destination "$src" --loglevel=error
          for alias in $ALIASES; do
            alias_tgz="$(node scripts/alias-tarball.mjs pack --alias "$alias" --out "$RUNNER_TEMP/alias-$alias" --tarball "$src"/rig-c-play-*.tgz)"
            npm publish "$alias_tgz" --provenance --access public --ignore-scripts
          done

      - name: Confirm every name serves the same files
        run: |
          set -euo pipefail
          version="$ALIAS_VERSION"
          dest="$RUNNER_TEMP/confirm"
          fetch() {
            local name="$1" into="$2" attempt
            mkdir -p "$into"
            for attempt in $(seq 1 30); do
              if npm pack "$name@$version" --pack-destination "$into" --loglevel=error > /dev/null 2>&1; then
                echo "fetched $name@$version on attempt $attempt"
                return 0
              fi
              sleep 30
            done
            echo "::error::$name@$version was not served within 15 minutes: confirmation NOT taken"
            return 1
          }
          fetch @rig-c/play "$dest/canonical"
          npm view "@rig-c/play@$version" version
          for alias in ${ALIASES:-rig-play spine-html}; do
            fetch "$alias" "$dest/$alias"
            npm view "$alias@$version" version
            node scripts/alias-tarball.mjs compare "$dest"/canonical/*.tgz "$dest/$alias"/*.tgz
          done
